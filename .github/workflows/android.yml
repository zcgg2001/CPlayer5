name: Android APK
on:
  push:
    paths: ['android/**', 'js/native-audio.js', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'js/native-audio.js', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test preview
        run: ./android/gradlew -p android assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CPlayer5-android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
