name: Android APK
on:
  push:
    paths: ['android/**', 'index.html', 'manifest.json', 'css/**', 'js/**', 'webfonts/**', 'img/**', 'scripts/build_android.sh', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'index.html', 'manifest.json', 'css/**', 'js/**', 'webfonts/**', 'img/**', 'scripts/build_android.sh', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test preview
        run: sh scripts/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CPlayer5-android-preview
          path: |
            output/android/CPlayer5-android-preview-*.apk
            output/android/SHA256SUMS.txt
          retention-days: 30
